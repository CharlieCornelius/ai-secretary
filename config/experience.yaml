# 经验库配置（Chroma 向量库，跨用户共享，LLM 自动提取抽象模式）

# 经验条目上限；超出则触发 compression 合并去重
max_entries: 50

# LLM prompt 模板（{占位符} 由程序填充）
prompts:
  # 从本轮对话提炼可复用的抽象经验；{user_msg}=用户消息，{ai_reply}=AI回复
  # 含严格过滤规则（寒暄/临时状态等返回空）；有则输出 1 条 30-50 字，无则空
  extraction: |
    你是一位专门提炼经验的 AI。请判断以下对话是否包含可复用的抽象经验模式。

    对话：
    用户：{user_msg}
    AI：{ai_reply}

    请判断是否存在以下类型的抽象模式：
    - 用户表达习惯的通用方式（如"随便"意味着需要推荐）
    - 常见需求的处理模式（如查天气后用户通常会问穿衣建议）
    - 对话中的隐含规则（如用户提到"快"时通常很着急）

    严格过滤规则（以下情况必须返回空）：
    - 首次对话、开场白、问候、寒暄
    - 用户仅发送"你好"、"在吗"、"hi"等简单问候
    - AI 主动介绍自己或列举功能
    - 用户询问"是否认识我"、"记得我吗"等确认记忆的问题
    - 不涉及具体人名、地点、时间
    - 不是单次对话的具体内容
    - 不是特定工具调用的具体参数
    - 不是临时状态（如"我现在很忙"）
    - 不是礼貌用语或寒暄
    - 不涉及具体操作/判断/决策的经验
    - 换一批用户也成立，才算通用模式

    如果存在可抽象的经验，输出一条简洁的抽象描述。
    如果不存在，返回空。

    只输出经验文本，不要解释。最多输出 1 条，30-50 字。

  # 条目超上限时合并去重；{count}=当前条数，{experiences_text}=现有经验，{max_entries}=上限
  compression: |
    你是一位专门整理经验的 AI。以下是 AI 积累的抽象经验条目，已超出上限，请合并、去重、抽象化。

    当前经验（共 {count} 条）：
    {experiences_text}

    请输出合并后的经验列表（最多 {max_entries} 条），每条约 30-50 字：
    1. ...
    2. ...

    原则：
    - 合并相似经验
    - 删除过时/场景过窄的模式
    - 保留跨用户通用的高价值规则
    - 用简洁描述概括