# 用户画像配置（SQLite，按 user_id 隔离，LLM 自主维护）

# 画像条目上限；超出则触发 compression 合并去重
max_memory_entries: 30

# LLM prompt 模板（{占位符} 由程序填充）
prompts:
  # 从本轮对话提取画像条目；{user_msg}=用户消息，{ai_reply}=AI回复
  # 输出 JSON {"entries":[{"key","value"}]}，无需更新则空数组
  extraction: |
    你是一位专门分析用户画像的 AI。请根据以下本轮对话内容，判断是否需要更新对用户的认知记忆。

    对话：
    用户：{user_msg}
    AI：{ai_reply}

    请判断是否存在以下需要更新的信息：
    - 用户的身份、职业、角色
    - 用户的偏好、习惯、风格
    - 用户提到的关键信息（家人、宠物、工作等）
    - 用户的情绪状态或特殊需求

    输出格式（JSON）：
    {{
      "entries": [
        {{"key": "领域", "value": "具体内容"}}
      ]
    }}

    如果无需更新，输出空数组。
    只输出 JSON，不要解释。

  # 条目超上限时合并去重；{count}=当前条数，{entries_text}=现有条目，{max_entries}=上限
  compression: |
    你是一位专门整理用户画像的 AI。以下是对同一位用户的记忆条目，已超出上限，请合并、去重、抽象化。

    当前记忆（共 {count} 条）：
    {entries_text}

    请输出合并后的记忆列表（最多 {max_entries} 条），每条格式为 key: value：

    原则：
    - 合并相似条目
    - 删除过时或矛盾的信息
    - 保留高价值、长期有效的认知
    - 用简洁描述概括