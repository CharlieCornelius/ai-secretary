name: 智能构建与发布

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  security-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
      is_tag_trigger: ${{ steps.guard.outputs.is_tag_trigger }}
      safe_version: ${{ steps.guard.outputs.safe_version }}
      skip_reason: ${{ steps.guard.outputs.skip_reason }}
    steps:
      - name: 拉取完整代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛂 执行安全准入检查
        id: guard
        run: |
          # set -x  # 打印每条命令，方便调试

          # ---------- 1. 防止 Bot 死循环 ----------
          if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "skip_reason=⏭️ 系统自动生成的标签，跳过以防止死循环" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---------- 2. 检查当前 commit 是否属于 main 分支 ----------
          # 使用更可靠的方式：列出所有包含该 commit 的本地分支
          branches=$(git branch --contains ${{ github.sha }} | sed 's/^* //' | tr -d ' ')
          echo "当前 commit 所在分支: $branches"
          if [[ ! "$branches" =~ (^| )main($| ) ]]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "skip_reason=⛔ 违反策略：当前 Commit 不属于 [main] 分支，拒绝构建" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---------- 3. 处理标签推送（手动发布大版本）----------
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"

            # 校验语义化版本格式
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "skip_reason=⛔ 标签格式错误：'$RAW_TAG' 不符合语义化版本 (正确示例: v1.2.3)" >> $GITHUB_OUTPUT
              exit 0
            fi

            # 检查标签是否已被占用（禁止覆盖）
            if git rev-parse "$RAW_TAG" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-list -n 1 "$RAW_TAG")
              if [[ "$TAG_COMMIT" != "${{ github.sha }}" ]]; then
                echo "should_build=false" >> $GITHUB_OUTPUT
                echo "skip_reason=⛔ 标签冲突：'$RAW_TAG' 已指向其他 Commit，禁止覆盖历史版本" >> $GITHUB_OUTPUT
                exit 0
              fi
            fi

            # 通过检查：允许构建标签
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "is_tag_trigger=true" >> $GITHUB_OUTPUT
            echo "safe_version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ 通过安检：手动发布大版本 $VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---------- 4. 处理 main 分支推送（自动递增补丁）----------
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == refs/heads/main ]]; then
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if [[ ! "$COMMIT_MSG" =~ \[build\] ]]; then
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "skip_reason=⏭️ 未携带 [build] 标记，本次推送不触发构建" >> $GITHUB_OUTPUT
              exit 0
            fi

            # 获取最新合规的 Tag
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
            [ -z "$LATEST_TAG" ] && LATEST_TAG="v0.0.0"
            BASE_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r major minor patch <<< "$BASE_VERSION"
            NEW_PATCH=$((patch + 1))
            NEW_VERSION="${major}.${minor}.${NEW_PATCH}"

            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "is_tag_trigger=false" >> $GITHUB_OUTPUT
            echo "safe_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "✅ 通过安检：自动递增补丁 $LATEST_TAG -> v$NEW_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ---------- 5. 兜底：未预料的情况 ----------
          echo "should_build=false" >> $GITHUB_OUTPUT
          echo "skip_reason=⚠️ 未知触发条件：event_name=${{ github.event_name }}, ref=${{ github.ref }}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: security-check
    if: needs.security-check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: ${{ github.sha }}
      cancel-in-progress: true
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.security-check.outputs.safe_version }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📌 自动创建补丁标签
        if: needs.security-check.outputs.is_tag_trigger == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TAG="v${{ needs.security-check.outputs.safe_version }}"
          git tag $NEW_TAG
          git push origin $NEW_TAG